name: Package FinJob UI Redesign

on:
  push:
    branches:
      - finjob-ui-redesign

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Package project
        run: |
          rm -rf frontend/node_modules frontend/dist .git
          zip -r FinJob-UI-Redesign.zip . -x "*.DS_Store"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FinJob-UI-Redesign
          path: FinJob-UI-Redesign.zip
