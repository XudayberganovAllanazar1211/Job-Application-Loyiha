name: FinJob CI

on:
  push:
    branches:
      - main
      - auth-google-forgot-password
  pull_request:
    branches:
      - main
      - auth-google-forgot-password

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINJOB_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/finjob_app
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/finjob_test
      SECRET_KEY: finjob-ci-test-secret-not-for-production
      CLICK_SERVICE_ID: ""
      CLICK_MERCHANT_ID: ""
      CLICK_SECRET_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Create separate application and test databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finjob_app"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE finjob_test"
      - name: Run unittest suite
        run: python -m unittest test_suite.py -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
