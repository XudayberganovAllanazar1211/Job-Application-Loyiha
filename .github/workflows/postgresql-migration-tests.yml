name: PostgreSQL migration tests

on:
  push:
    branches:
      - feature/postgresql-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finjob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finjob_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile backend modules
        run: |
          python -m py_compile backend/main.py backend/payments.py backend/pg_compat.py backend/migrate_sqlite_to_postgres.py backend/test_suite.py

      - name: Test SQLite-to-PostgreSQL importer in an isolated schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finjob_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finjob_test
          DATABASE_SCHEMA: finjob_import_ci
          FINJOB_ENV: test
          NEON_BRANCH: finjob-development
        run: |
          cd backend
          python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path

          import psycopg
          from psycopg import sql as pg_sql

          from migrate_sqlite_to_postgres import migrate

          schema = "finjob_import_ci"
          dsn = "postgresql://postgres:postgres@localhost:5432/finjob_test"

          with psycopg.connect(dsn) as target:
              target.execute(
                  pg_sql.SQL("DROP SCHEMA IF EXISTS {} CASCADE").format(
                      pg_sql.Identifier(schema)
                  )
              )

          with tempfile.TemporaryDirectory(prefix="finjob-import-ci-") as directory:
              sqlite_path = Path(directory) / "fixture.db"
              with sqlite3.connect(sqlite_path) as source:
                  source.execute(
                      "CREATE TABLE users("
                      "id INTEGER PRIMARY KEY AUTOINCREMENT,"
                      "username TEXT UNIQUE NOT NULL,balance REAL NOT NULL DEFAULT 0)"
                  )
                  source.execute(
                      "CREATE TABLE wallet_transactions("
                      "id INTEGER PRIMARY KEY AUTOINCREMENT,"
                      "user_id INTEGER NOT NULL,amount REAL NOT NULL,"
                      "balance_after REAL NOT NULL)"
                  )
                  source.execute("CREATE INDEX idx_users_balance ON users(balance DESC)")
                  source.executemany(
                      "INSERT INTO users(username,balance) VALUES(?,?)",
                      [("import_user_a", 0.10), ("import_user_b", 1000.25)],
                  )
                  source.executemany(
                      "INSERT INTO wallet_transactions(user_id,amount,balance_after) VALUES(?,?,?)",
                      [(1, 0.10, 0.10), (2, 1000.25, 1000.25)],
                  )

              migrate(sqlite_path, "finjob-development")

          try:
              with psycopg.connect(dsn) as target:
                  target.execute(
                      pg_sql.SQL("SET search_path TO {}").format(
                          pg_sql.Identifier(schema)
                      )
                  )
                  users = target.execute(
                      "SELECT id,username,balance FROM users ORDER BY id"
                  ).fetchall()
                  assert len(users) == 2, users
                  assert users[0][1] == "import_user_a" and str(users[0][2]) == "0.10", users
                  assert users[1][1] == "import_user_b" and str(users[1][2]) == "1000.25", users
                  assert target.execute(
                      "SELECT COUNT(*) FROM wallet_transactions"
                  ).fetchone()[0] == 2
                  assert target.execute(
                      "SELECT EXISTS(SELECT 1 FROM pg_indexes WHERE schemaname=%s AND indexname='idx_users_balance')",
                      (schema,),
                  ).fetchone()[0]
                  next_id = target.execute(
                      "INSERT INTO users(username,balance) VALUES('import_user_c',0) RETURNING id"
                  ).fetchone()[0]
                  assert next_id > users[-1][0], next_id
                  assert target.execute(
                      "SELECT version FROM schema_migrations WHERE version=1"
                  ).fetchone()[0] == 1
          finally:
              with psycopg.connect(dsn) as target:
                  target.execute(
                      pg_sql.SQL("DROP SCHEMA IF EXISTS {} CASCADE").format(
                          pg_sql.Identifier(schema)
                      )
                  )
          PY

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finjob_application
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finjob_test
          DATABASE_SCHEMA: finjob_ci
          FINJOB_ENV: test
          FINJOB_ALLOW_EMPTY_DB_BOOTSTRAP: "1"
          SECRET_KEY: finjob-ci-test-secret-not-for-production
          CORS_ORIGINS: http://localhost:5173
        run: python backend/test_suite.py
