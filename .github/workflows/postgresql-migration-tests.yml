name: PostgreSQL migration tests

on:
  push:
    branches:
      - feature/postgresql-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finjob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finjob_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile backend modules
        run: |
          python -m py_compile backend/main.py backend/payments.py backend/pg_compat.py backend/migrate_sqlite_to_postgres.py backend/test_suite.py

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finjob_application
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finjob_test
          DATABASE_SCHEMA: finjob_ci
          FINJOB_ENV: test
          FINJOB_ALLOW_EMPTY_DB_BOOTSTRAP: "1"
          SECRET_KEY: finjob-ci-test-secret-not-for-production
          CORS_ORIGINS: http://localhost:5173
        run: python backend/test_suite.py
